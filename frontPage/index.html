<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            box-sizing: border-box;
            background-color: #38141f;
            background-image: url('8.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* --- STAGE CANVAS (FULL-BLEED SCALING) --- */
        .page-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1920px;
            height: 1080px;
            transform: translate(-50%, -50%) scale(var(--stage-scale, 1));
            transform-origin: center center;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- TRANSITION OVERLAY --- */
        .page-transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #38141f; 
            z-index: 9999;             
            pointer-events: auto;
            opacity: 1;
            transition: opacity 0.4s ease-in-out;
        }

        .page-loaded .page-transition-overlay {
            opacity: 0;
            pointer-events: none;
        }

        img {
            max-width: 90%;
            height: auto;
        }

        .click-btn {
            background-color: #f5f5f5;
            color: #7a2e2e;
            border: none;
            border-radius: 50px;
            padding: 20px 40px;
            font-size: 32px;
            cursor: pointer;
            font-family: serif;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: absolute;
            bottom: 20%; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            transition: transform 0.3s ease;
        }

        .click-btn:hover {
            transform: translateX(-50%) scale(1.05);
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="pageOverlay"></div>

    <div class="page-stage">
        <img src="9.png" alt="Birthday Cake">
        
        <button class="click-btn" onclick="navigateToPage('envelope.html')">
            CLICK ME!
        </button>
    </div>

    <script>
        function updateStageScale() {
            const stage = document.querySelector('.page-stage');
            if (stage) {
                const scaleX = window.innerWidth / 1920;
                const scaleY = window.innerHeight / 1080;
                const scale = Math.min(scaleX, scaleY);
                stage.style.setProperty('--stage-scale', scale);
            }
        }

        window.addEventListener('resize', updateStageScale);

        window.addEventListener('DOMContentLoaded', () => {
            updateStageScale();
            setTimeout(() => {
                document.body.classList.add('page-loaded');
            }, 50); 
        });

        function navigateToPage(url) {
            const overlay = document.getElementById('pageOverlay');
            if (overlay) {
                overlay.style.pointerEvents = 'auto';
                overlay.style.opacity = '1';
                setTimeout(() => {
                    window.location.href = url;
                }, 400);
            } else {
                window.location.href = url;
            }
        }
    </script>
</body>
</html>
